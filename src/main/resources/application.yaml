spring:
  application:
    name: consulta-legal-ciberdelitos
  
  datasource:
    url: jdbc:postgresql://localhost:5433/delitos_db
    username: postgres
    password: etitc2025..
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
  
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    com.itc.consultalegal: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE